<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTracker</title>
    <style>
      :root {
        --bg: #faf7f7;
        --panel: #ffffff;
        --panel-soft: #fffafb;
        --border: #f3e8e8;
        --primary: #f472b6;
        --primary-dark: #ec4899;
        --primary-soft: #fdf2f8;
        --text: #1f2937;
        --muted: #6b7280;
        --shadow: 0 12px 28px rgba(31, 41, 55, 0.06);
        --blue-soft: #e0f2fe;
        --blue-text: #0284c7;
        --pink-soft: #fce7f3;
        --pink-text: #be185d;
        --green-soft: #dcfce7;
        --green-text: #16a34a;
        --gray-soft: #f1f5f9;
        --gray-text: #64748b;
        --shadow-soft: 0 4px 20px rgba(15, 23, 42, 0.04);
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(244, 114, 182, 0.08), transparent 18%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .hidden {
        display: none !important;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        width: 260px;
        min-height: 100vh;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-right: 1px solid var(--border);
        padding: 28px 18px;
        box-shadow: inset -1px 0 0 rgba(244, 114, 182, 0.05);
      }

      .brand {
        font-size: 1.9rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--text);
        margin-bottom: 28px;
        padding-left: 8px;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .nav-item {
        width: 100%;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text);
        border-radius: 14px;
        padding: 14px 16px;
        text-align: left;
        font-size: 1rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.2s ease;
      }

      .nav-item:hover {
        background: var(--primary-soft);
        border-color: rgba(244, 114, 182, 0.2);
      }

      .nav-item.active {
        background: linear-gradient(180deg, var(--primary-soft), #fce7f3);
        border-color: rgba(244, 114, 182, 0.25);
        color: var(--primary-dark);
        box-shadow: 0 8px 18px rgba(244, 114, 182, 0.12);
      }

      .content {
        flex: 1;
        padding: 32px 28px 40px;
      }

      .view {
        width: 100%;
      }

      .list-view {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
      }

      .metric-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: linear-gradient(180deg, #ffffff 0%, #fffafc 100%);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow-soft);
        padding: 16px 18px 14px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .metric-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      }

      .metric-card::before {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 10px;
        margin-bottom: 12px;
        font-size: 0.85rem;
        line-height: 1;
        background: rgba(244, 114, 182, 0.1);
      }

      .metric-card:nth-child(1)::before { content: "📊"; background: rgba(249, 168, 212, 0.12); }
      .metric-card:nth-child(2)::before { content: "📨"; background: rgba(167, 243, 208, 0.16); }
      .metric-card:nth-child(3)::before { content: "⏳"; background: rgba(147, 197, 253, 0.16); }
      .metric-card:nth-child(4)::before { content: "❌"; background: rgba(251, 207, 232, 0.15); }
      .metric-card:nth-child(5)::before { content: "✨"; background: rgba(196, 181, 253, 0.16); }

      .metric-label {
        display: inline-flex;
        align-items: center;
        font-size: 0.75rem;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .metric-value {
        display: block;
        margin-top: 10px;
        font-size: 1.95rem;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: var(--text);
      }

      .empty-state {
        background: var(--panel);
        border: 1px dashed var(--border);
        border-radius: 18px;
        padding: 26px 18px;
        text-align: center;
        color: var(--muted);
        box-shadow: var(--shadow-soft);
      }

      .applications-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
      }

      .application-card {
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: linear-gradient(180deg, #ffffff 0%, #fffdfd 100%);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 18px 16px 16px;
        box-shadow: var(--shadow-soft);
        transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      }

      .application-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
        border-color: rgba(244, 114, 182, 0.22);
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .card-title-group {
        min-width: 0;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        align-items: center;
        column-gap: 12px;
        row-gap: 4px;
        flex: 1;
      }

      .company-initial {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--pink-soft);
        color: var(--pink-text);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.05rem;
        flex-shrink: 0;
        grid-column: 1;
        grid-row: 1 / span 2;
      }

      .company-name {
        font-size: 1.12rem;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.03em;
        grid-column: 2;
        grid-row: 1;
      }

      .role-name {
        color: var(--muted);
        font-size: 0.94rem;
        font-weight: 600;
        line-height: 1.45;
        grid-column: 2;
        grid-row: 2;
      }

      .status-select {
        border: 1px solid #f7d8e8;
        border-radius: 999px;
        background: linear-gradient(180deg, #fff7fb 0%, #fff 100%);
        color: var(--text);
        padding: 7px 10px;
        font-size: 0.72rem;
        font-weight: 700;
        min-width: 118px;
        text-align: center;
      }

      .meta-row {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        width: fit-content;
        padding: 6px 10px;
        border-radius: 999px;
        background: #f8fafc;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .meta-row strong {
        color: var(--text);
        font-size: 0.8rem;
      }

      .notes {
        background: var(--gray-soft);
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        color: var(--text);
        line-height: 1.6;
        white-space: pre-wrap;
        padding: 11px 12px;
        margin: 0;
        font-size: 0.86rem;
      }

      .card-block {
        margin: 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: linear-gradient(180deg, #fffafc 0%, #fff 100%);
        border: 1px solid #f7d8e8;
        color: var(--text);
        font-size: 0.8rem;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card-block strong {
        color: var(--text);
      }

      .card-links,
      .card-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .card-gallery {
        margin-top: 2px;
      }

      .card-links {
        margin-top: -2px;
      }

      .link-button,
      .link-text,
      .image-link,
      .contact-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 0.77rem;
        font-weight: 700;
        text-decoration: none;
      }

      .link-button,
      .contact-link {
        border: 1px solid rgba(244, 114, 182, 0.18);
        background: linear-gradient(180deg, #fff8fb 0%, #fff1f6 100%);
        color: var(--primary-dark);
        box-shadow: 0 2px 10px rgba(244, 114, 182, 0.07);
      }

      .link-button:hover,
      .contact-link:hover {
        background: #fce7f3;
      }

      .link-text {
        background: #f3f4f6;
        color: var(--muted);
        border: 1px solid #eceff2;
      }

      .image-link {
        overflow: hidden;
        padding: 0;
        border: 1px solid var(--border);
        background: #fff;
        width: 100%;
        max-width: 200px;
        height: 120px;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      }

      .screenshot-thumb {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: auto;
        padding-top: 6px;
      }

      .edit-button,
      .delete-button {
        border: none;
        font-weight: 700;
        padding: 8px 11px;
        border-radius: 9px;
        transition: all 0.2s ease;
      }

      .edit-button {
        background: #f9fafb;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .edit-button:hover {
        background: var(--primary-soft);
        color: var(--primary-dark);
      }

      .delete-button {
        background: transparent;
        color: #dc2626;
      }

      .delete-button:hover {
        background: #fee2e2;
      }

      .form-panel {
        max-width: 680px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 28px;
      }

      .form-panel h2 {
        font-size: clamp(1.5rem, 3vw, 2rem);
        margin-bottom: 20px;
        color: var(--text);
      }

      #application-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text);
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        color: var(--text);
        padding: 0.85rem 0.95rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.12);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
      }

      .primary-button {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        font-weight: 700;
        padding: 0.9rem 1.3rem;
        box-shadow: 0 10px 18px rgba(244, 114, 182, 0.22);
      }

      .primary-button:hover {
        filter: brightness(0.98);
      }

      @media (max-width: 760px) {
        .app {
          flex-direction: column;
        }

        .sidebar {
          position: static;
          width: 100%;
          min-height: auto;
          border-right: none;
          border-bottom: 1px solid var(--border);
          padding: 18px 16px;
        }

        .nav {
          flex-direction: row;
          flex-wrap: wrap;
        }

        .nav-item {
          width: auto;
          flex: 1 1 180px;
        }

        .content {
          padding: 20px 16px 30px;
        }

        .form-panel {
          padding: 20px 16px;
        }

        .card-top {
          flex-direction: column;
          align-items: stretch;
        }

        .status-select {
          width: 100%;
        }
      }

      @media (min-width: 1100px) {
        .applications-list {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Navegación principal">
        <div class="brand">JobTracker</div>

        <nav class="nav" aria-label="Menú principal">
          <button type="button" class="nav-item active" data-view="list">
            <span aria-hidden="true">📋</span>
            <span>Ver postulaciones</span>
          </button>
          <button type="button" class="nav-item" data-view="form">
            <span aria-hidden="true">✍️</span>
            <span>Nueva postulación</span>
          </button>
        </nav>
      </aside>

      <main class="content">
        <section id="view-list" class="view list-view" aria-label="Vista de postulaciones">
          <div class="summary" aria-label="Métricas de postulaciones">
            <article class="metric-card">
              <span class="metric-label">Total</span>
              <strong id="metric-total" class="metric-value">0</strong>
            </article>

            <article class="metric-card">
              <span class="metric-label">Enviado</span>
              <strong id="metric-enviado" class="metric-value">0</strong>
            </article>

            <article class="metric-card">
              <span class="metric-label">En proceso</span>
              <strong id="metric-proceso" class="metric-value">0</strong>
            </article>

            <article class="metric-card">
              <span class="metric-label">Rechazado</span>
              <strong id="metric-rechazado" class="metric-value">0</strong>
            </article>

            <article class="metric-card">
              <span class="metric-label">Oferta</span>
              <strong id="metric-oferta" class="metric-value">0</strong>
            </article>
          </div>

          <div id="empty-state" class="empty-state hidden">
            <p>No hay postulaciones registradas.</p>
          </div>

          <ul id="applications-list" class="applications-list" aria-live="polite"></ul>
        </section>

        <section id="view-form" class="view hidden" aria-label="Vista del formulario">
          <div class="form-panel">
            <h2 id="form-title">Nueva postulación</h2>

            <form id="application-form" novalidate>
              <div class="field-group">
                <label for="empresa">Empresa</label>
                <input id="empresa" name="empresa" type="text" maxlength="120" required />
              </div>

              <div class="field-group">
                <label for="rol">Rol</label>
                <input id="rol" name="rol" type="text" maxlength="120" required />
              </div>

              <div class="field-group">
                <label for="fecha">Fecha</label>
                <input id="fecha" name="fecha" type="date" required />
              </div>

              <div class="field-group">
                <label for="link-postulacion">Link de la postulación</label>
                <input id="link-postulacion" name="link-postulacion" type="url" placeholder="https://..." />
              </div>

              <div class="field-group">
                <label for="cv-utilizado">CV utilizado</label>
                <input
                  id="cv-utilizado"
                  name="cv-utilizado"
                  type="text"
                  maxlength="300"
                  placeholder="Pega el link de Drive/LinkedIn o el nombre del archivo"
                />
              </div>

              <div class="field-group">
                <label for="cv-file">Subir archivo del CV</label>
                <input id="cv-file" name="cv-file" type="file" accept=".pdf,.doc,.docx,.odt,.ppt,.pptx,image/png,image/jpeg" />
              </div>

              <div class="field-group">
                <label for="screenshot-upload">Agregar captura / imagen</label>
                <input id="screenshot-upload" name="screenshot-upload" type="file" accept="image/*" multiple />
              </div>

              <div class="field-group">
                <label for="recruiter-nombre">Nombre del Recruiter / Contacto</label>
                <input id="recruiter-nombre" name="recruiter-nombre" type="text" maxlength="120" placeholder="Ej: Paula García" />
              </div>

              <div class="field-group">
                <label for="recruiter-medio">Medio de contacto</label>
                <select id="recruiter-medio" name="recruiter-medio">
                  <option value="">Seleccionar</option>
                  <option value="LinkedIn">LinkedIn</option>
                  <option value="Email">Email</option>
                  <option value="Portal Web">Portal Web</option>
                  <option value="Referido">Referido</option>
                </select>
              </div>

              <div class="field-group">
                <label for="recruiter-link">Link de contacto o perfil</label>
                <input id="recruiter-link" name="recruiter-link" type="url" placeholder="https://..." />
              </div>

              <div class="field-group">
                <label for="estado">Estado</label>
                <select id="estado" name="estado" required>
                  <option value="">Seleccionar</option>
                  <option value="Enviado">Enviado</option>
                  <option value="En proceso">En proceso</option>
                  <option value="Rechazado">Rechazado</option>
                  <option value="Oferta">Oferta</option>
                </select>
              </div>

              <div class="field-group">
                <label for="notas">Notas</label>
                <textarea
                  id="notas"
                  name="notas"
                  rows="4"
                  maxlength="500"
                  placeholder="Agrega detalles o recordatorios"
                ></textarea>
              </div>

              <div class="actions">
                <button type="submit" id="submit-button" class="primary-button">Guardar</button>
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script>
      const STORAGE_KEY = "postulaciones-app";
      const VALID_ESTADOS = ["Enviado", "En proceso", "Rechazado", "Oferta"];

      const views = {
        list: document.getElementById("view-list"),
        form: document.getElementById("view-form")
      };

      const navButtons = document.querySelectorAll(".nav-item");
      const form = document.getElementById("application-form");
      const empresaInput = document.getElementById("empresa");
      const rolInput = document.getElementById("rol");
      const fechaInput = document.getElementById("fecha");
      const linkInput = document.getElementById("link-postulacion");
      const cvInput = document.getElementById("cv-utilizado");
      const cvFileInput = document.getElementById("cv-file");
      const screenshotInput = document.getElementById("screenshot-upload");
      const recruiterNombreInput = document.getElementById("recruiter-nombre");
      const recruiterMedioInput = document.getElementById("recruiter-medio");
      const recruiterLinkInput = document.getElementById("recruiter-link");
      const estadoInput = document.getElementById("estado");
      const notasInput = document.getElementById("notas");
      const listElement = document.getElementById("applications-list");
      const emptyState = document.getElementById("empty-state");
      const formTitle = document.getElementById("form-title");
      const submitButton = document.getElementById("submit-button");

      let postulaciones = loadPostulaciones();
      let editingId = null;
      let existingScreenshots = [];

      function normalizeEstado(value) {
        return VALID_ESTADOS.includes(value) ? value : "Enviado";
      }

      function normalizeLink(value) {
        if (typeof value !== "string") return "";
        const trimmed = value.trim();
        if (!trimmed) return "";

        if (/^https?:\/\//i.test(trimmed) || /^mailto:/i.test(trimmed)) {
          return trimmed;
        }

        if (/^(www\.)/i.test(trimmed) || /\.[a-z]{2,}/i.test(trimmed)) {
          return `https://${trimmed}`;
        }

        return "";
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
          reader.readAsDataURL(file);
        });
      }

      function normalizePostulacion(item) {
        if (!item || typeof item !== "object") {
          return null;
        }

        const empresa = typeof item.empresa === "string" ? item.empresa.trim() : "";
        const rol = typeof item.rol === "string" ? item.rol.trim() : "";
        const fecha = typeof item.fecha === "string" ? item.fecha : "";
        const notas = typeof item.notas === "string" ? item.notas.trim() : "";
        const estado = normalizeEstado(item.estado);
        const linkVacante = normalizeLink(item.linkVacante);
        const cvUtilizado = typeof item.cvUtilizado === "string" ? item.cvUtilizado.trim() : "";
        const cvFileData = typeof item.cvFileData === "string" ? item.cvFileData : "";
        const cvFileName = typeof item.cvFileName === "string" ? item.cvFileName.trim() : "";
        const screenshots = Array.isArray(item.screenshots)
          ? item.screenshots.filter((url) => typeof url === "string" && url)
          : [];
        const recruiterNombre = typeof item.recruiterNombre === "string" ? item.recruiterNombre.trim() : "";
        const recruiterMedio = typeof item.recruiterMedio === "string" ? item.recruiterMedio : "";
        const recruiterLink = normalizeLink(item.recruiterLink);

        if (!empresa || !rol || !fecha) {
          return null;
        }

        const id =
          typeof item.id === "string" && item.id
            ? item.id
            : `post-${Date.now()}-${Math.random().toString(16).slice(2)}`;

        return {
          id,
          empresa,
          rol,
          fecha,
          estado,
          linkVacante,
          cvUtilizado,
          cvFileData,
          cvFileName,
          screenshots,
          recruiterNombre,
          recruiterMedio,
          recruiterLink,
          notas
        };
      }

      function loadPostulaciones() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return [];
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) return [];
          return parsed.map(normalizePostulacion).filter(Boolean);
        } catch (error) {
          return [];
        }
      }

      function savePostulaciones() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(postulaciones));
        } catch (error) {
        }
      }

      function setView(viewName) {
        const nextView = viewName === "form" ? "form" : "list";

        Object.entries(views).forEach(([key, element]) => {
          element.classList.toggle("hidden", key !== nextView);
        });

        navButtons.forEach((button) => {
          const isActive = button.dataset.view === nextView;
          button.classList.toggle("active", isActive);
        });
      }

      function formatDate(dateString) {
        const date = new Date(`${dateString}T00:00:00`);
        if (Number.isNaN(date.getTime())) {
          return dateString;
        }

        return new Intl.DateTimeFormat("es-ES", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }).format(date);
      }

      function updateMetrics() {
        const summary = {
          Total: postulaciones.length,
          Enviado: 0,
          "En proceso": 0,
          Rechazado: 0,
          Oferta: 0
        };

        postulaciones.forEach((postulacion) => {
          summary[postulacion.estado] = (summary[postulacion.estado] || 0) + 1;
        });

        document.getElementById("metric-total").textContent = String(summary.Total);
        document.getElementById("metric-enviado").textContent = String(summary.Enviado);
        document.getElementById("metric-proceso").textContent = String(summary["En proceso"]);
        document.getElementById("metric-rechazado").textContent = String(summary.Rechazado);
        document.getElementById("metric-oferta").textContent = String(summary.Oferta);
      }

      function buildLinkButton(label, href, isDownload = false) {
        const link = document.createElement("a");
        link.className = "link-button";
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        if (isDownload) {
          link.download = "CV.pdf";
        }
        link.textContent = label;
        return link;
      }

      function renderList() {
        listElement.innerHTML = "";

        if (postulaciones.length === 0) {
          emptyState.classList.remove("hidden");
          return;
        }

        emptyState.classList.add("hidden");

        postulaciones.forEach((postulacion) => {
          const item = document.createElement("li");
          item.className = "application-card";

          const top = document.createElement("div");
          top.className = "card-top";

          const textGroup = document.createElement("div");
          textGroup.className = "card-title-group";

          const initial = document.createElement("div");
          initial.className = "company-initial";
          initial.textContent = postulacion.empresa.charAt(0).toUpperCase() || "A";

          const company = document.createElement("div");
          company.className = "company-name";
          company.textContent = postulacion.empresa;

          const role = document.createElement("p");
          role.className = "role-name";
          role.textContent = postulacion.rol;

          textGroup.append(initial, company, role);

          const statusSelect = document.createElement("select");
          statusSelect.className = "status-select";
          statusSelect.dataset.id = postulacion.id;
          statusSelect.setAttribute("aria-label", `Cambiar estado de ${postulacion.empresa}`);

          ["Enviado", "En proceso", "Oferta", "Rechazado"].forEach((estado) => {
            const option = document.createElement("option");
            option.value = estado;
            option.textContent = estado;
            if (estado === postulacion.estado) {
              option.selected = true;
            }
            statusSelect.appendChild(option);
          });

          top.append(textGroup, statusSelect);

          const meta = document.createElement("div");
          meta.className = "meta-row";
          meta.innerHTML = `<span aria-hidden="true">📅</span><strong>${formatDate(postulacion.fecha)}</strong>`;

          const contactBlock = document.createElement("div");
          contactBlock.className = "card-block";
          const hasContact = Boolean(
            postulacion.recruiterNombre || postulacion.recruiterMedio || postulacion.recruiterLink
          );

          if (hasContact) {
            const contactText = document.createElement("span");
            const recruiterName = postulacion.recruiterNombre ? postulacion.recruiterNombre : "Contacto";
            const recruiterMedium = postulacion.recruiterMedio ? ` (${postulacion.recruiterMedio})` : "";
            contactText.textContent = `👤 Contacto: ${recruiterName}${recruiterMedium}`;
            contactBlock.appendChild(contactText);

            if (postulacion.recruiterLink) {
              const contactLink = document.createElement("a");
              contactLink.className = "contact-link";
              contactLink.href = postulacion.recruiterLink;
              contactLink.target = "_blank";
              contactLink.rel = "noopener noreferrer";
              contactLink.textContent = "Abrir contacto";
              contactBlock.appendChild(contactLink);
            }
          }

          const linksWrap = document.createElement("div");
          linksWrap.className = "card-links";

          if (postulacion.linkVacante) {
            const vacanteLink = buildLinkButton("Ver vacante", postulacion.linkVacante);
            linksWrap.appendChild(vacanteLink);
          }

          if (postulacion.cvFileData || postulacion.cvUtilizado) {
            const cvHref = postulacion.cvFileData || normalizeLink(postulacion.cvUtilizado);
            if (cvHref) {
              const cvLabel = postulacion.cvFileName ? `CV: ${postulacion.cvFileName}` : "CV";
              const cvLink = buildLinkButton(cvLabel, cvHref, Boolean(postulacion.cvFileData));
              linksWrap.appendChild(cvLink);
            } else {
              const cvText = document.createElement("span");
              cvText.className = "link-text";
              cvText.textContent = "CV disponible";
              linksWrap.appendChild(cvText);
            }
          }

          const gallery = document.createElement("div");
          gallery.className = "card-gallery";

          if (postulacion.screenshots && postulacion.screenshots.length) {
            postulacion.screenshots.forEach((screenshot) => {
              const imageLink = document.createElement("a");
              imageLink.className = "image-link";
              imageLink.href = screenshot;
              imageLink.target = "_blank";
              imageLink.rel = "noopener noreferrer";

              const img = document.createElement("img");
              img.className = "screenshot-thumb";
              img.src = screenshot;
              img.alt = `Captura de ${postulacion.empresa}`;
              imageLink.appendChild(img);
              gallery.appendChild(imageLink);
            });
          }

          const notes = document.createElement("p");
          notes.className = "notes";
          notes.textContent = postulacion.notas || "Sin notas adicionales.";

          const actions = document.createElement("div");
          actions.className = "card-actions";

          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.className = "edit-button";
          editButton.textContent = "Editar";
          editButton.addEventListener("click", () => {
            startEditing(postulacion.id);
          });

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "delete-button";
          deleteButton.textContent = "Eliminar";
          deleteButton.addEventListener("click", () => {
            deletePostulacion(postulacion.id);
          });

          actions.append(editButton, deleteButton);

          item.append(top, meta, notes, contactBlock, linksWrap, gallery, actions);
          listElement.appendChild(item);
        });
      }

      function deletePostulacion(id) {
        postulaciones = postulaciones.filter((postulacion) => postulacion.id !== id);
        savePostulaciones();
        renderList();
        updateMetrics();
      }

      function startEditing(id) {
        const postulacion = postulaciones.find((item) => item.id === id);
        if (!postulacion) return;

        editingId = id;
        formTitle.textContent = "Editar postulación";
        submitButton.textContent = "Actualizar";

        empresaInput.value = postulacion.empresa;
        rolInput.value = postulacion.rol;
        fechaInput.value = postulacion.fecha;
        linkInput.value = postulacion.linkVacante;
        cvInput.value = postulacion.cvUtilizado;
        estadoInput.value = postulacion.estado;
        notasInput.value = postulacion.notas;
        recruiterNombreInput.value = postulacion.recruiterNombre;
        recruiterMedioInput.value = postulacion.recruiterMedio;
        recruiterLinkInput.value = postulacion.recruiterLink;
        existingScreenshots = postulacion.screenshots || [];

        setView("form");
      }

      function resetForm() {
        form.reset();
        editingId = null;
        existingScreenshots = [];
        formTitle.textContent = "Nueva postulación";
        submitButton.textContent = "Guardar";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const empresa = empresaInput.value.trim();
        const rol = rolInput.value.trim();
        const fecha = fechaInput.value;
        const estado = normalizeEstado(estadoInput.value);

        if (!empresa || !rol || !fecha || !estado) {
          return;
        }

        const screenshots = [...(existingScreenshots || [])];

        for (const file of screenshotInput.files || []) {
          screenshots.push(await readFileAsDataUrl(file));
        }

        const payload = {
          id: editingId || `post-${Date.now()}`,
          empresa,
          rol,
          fecha,
          linkVacante: normalizeLink(linkInput.value),
          cvUtilizado: cvInput.value.trim(),
          cvFileData: "",
          cvFileName: "",
          screenshots,
          recruiterNombre: recruiterNombreInput.value.trim(),
          recruiterMedio: recruiterMedioInput.value,
          recruiterLink: normalizeLink(recruiterLinkInput.value),
          estado,
          notas: notasInput.value.trim()
        };

        if (cvFileInput.files && cvFileInput.files[0]) {
          const file = cvFileInput.files[0];
          payload.cvFileData = await readFileAsDataUrl(file);
          payload.cvFileName = file.name;
        }

        if (editingId) {
          postulaciones = postulaciones.map((item) => (item.id === editingId ? payload : item));
        } else {
          postulaciones = [payload, ...postulaciones];
        }

        savePostulaciones();
        renderList();
        updateMetrics();
        resetForm();
        setView("list");
      });

      navButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const nextView = button.dataset.view;
          setView(nextView);
        });
      });

      renderList();
      updateMetrics();
    </script>
  </body>
</html>
